version: '3.8'
services:
  ai_core:
    build: .
    volumes:
      - .:/app
    environment:
      - MT5_ZMQ_PORT=5555
    depends_on:
      - timescaledb
      - redis
  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py
    ports:
      - "8501:8501"
    volumes:
      - .:/app
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_PASSWORD=quant
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
